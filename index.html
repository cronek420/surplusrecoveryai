
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEXICON SOLUTIONS | Master Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
        
        :root {
          --brand-primary: #818cf8;
          --brand-accent: #10b981;
          --bg-base: #050507;
        }

        body { 
          font-family: 'Plus Jakarta Sans', sans-serif; 
          background-color: var(--bg-base); 
          color: #fafafa;
          margin: 0;
          overflow: hidden;
          letter-spacing: -0.01em;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Tactical HUD Background */
        body::before {
          content: "";
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          background: 
            radial-gradient(circle at 0% 0%, rgba(129, 140, 248, 0.08) 0%, transparent 40%),
            radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.04) 0%, transparent 40%),
            url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
          opacity: 0.4;
          pointer-events: none;
          z-index: -1;
        }

        .border-zinc { border-color: rgba(39, 39, 42, 0.4); }
        
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #18181b; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #27272a; }

        .dossier-panel {
          transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
          box-shadow: -40px 0 80px rgba(0,0,0,0.7);
        }

        .card-hover {
          transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
          transform: translateY(-2px);
          background-color: rgba(255,255,255,0.03);
          border-color: rgba(255,255,255,0.15);
        }

        @keyframes marquee {
          0% { transform: translateX(0); }
          100% { transform: translateX(-50%); }
        }
        .animate-marquee {
          display: inline-flex;
          animation: marquee 60s linear infinite;
        }

        .glass {
          background: rgba(10, 10, 15, 0.85);
          backdrop-filter: blur(20px);
          border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .lexicon-glow {
          box-shadow: 0 0 20px rgba(129, 140, 248, 0.2);
        }
    </style>
<script type="importmap">

</head>

</body>
</html>
