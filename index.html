
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SR-AI | Command Deck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
        
        :root {
          --brand-primary: #6366f1;
          --brand-emerald: #10b981;
          --bg-base: #09090b;
        }

        body { 
          font-family: 'Plus Jakarta Sans', sans-serif; 
          background-color: var(--bg-base); 
          color: #fafafa;
          margin: 0;
          overflow: hidden;
          letter-spacing: -0.01em;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Premium Background Gradient */
        body::before {
          content: "";
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          background: 
            radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.05) 0%, transparent 50%),
            radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.03) 0%, transparent 50%);
          pointer-events: none;
          z-index: -1;
        }

        .border-zinc { border-color: rgba(39, 39, 42, 0.6); }
        
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #18181b; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #27272a; }

        .dossier-panel {
          transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
          box-shadow: -20px 0 60px rgba(0,0,0,0.5);
        }

        .card-hover {
          transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
          transform: translateY(-2px);
          background-color: rgba(255,255,255,0.02);
          border-color: rgba(255,255,255,0.1);
        }

        @keyframes marquee {
          0% { transform: translateX(0); }
          100% { transform: translateX(-50%); }
        }
        .animate-marquee {
          display: inline-flex;
          animation: marquee 40s linear infinite;
        }

        .glass {
          background: rgba(15, 15, 20, 0.7);
          backdrop-filter: blur(12px);
          border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
<script type="importmap">

}

</head>

</body>
</html>
